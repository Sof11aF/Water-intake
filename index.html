<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Water Tracker</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5A9DBF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Water Tracker">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #EDE8DF;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .phone {
      background: #F5F0E8;
      border-radius: 36px;
      padding: 28px 18px 24px;
      width: 100%;
      max-width: 380px;
      border: 1px solid #d9d3c7;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .greeting { font-size: 13px; color: #999; margin-bottom: 2px; }
    .date-line { font-size: 18px; font-weight: 600; color: #2c2c2a; margin-bottom: 16px; }

    .bottle-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 12px; }
    .ml-label { font-size: 26px; font-weight: 600; color: #5A9DBF; text-align: center; margin-top: 4px; }
    .goal-label { font-size: 12px; color: #bbb; text-align: center; margin-bottom: 14px; }

    .quick-add-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .quick-btn {
      flex: 1; background: #fff; border: 1px solid #e0dbd0;
      border-radius: 14px; padding: 10px 4px; font-size: 12px;
      cursor: pointer; color: #666; transition: background 0.12s;
    }
    .quick-btn:hover { background: #f0ebe0; }
    .quick-btn .amt { font-size: 16px; font-weight: 600; color: #5A9DBF; }

    .custom-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .custom-row input {
      flex: 1; border: 1px solid #ddd8ce; border-radius: 12px;
      padding: 10px 14px; font-size: 13px; background: #fff; color: #333; outline: none;
    }
    .custom-row input:focus { border-color: #5A9DBF; }
    .custom-row button {
      background: #5A9DBF; border: none; border-radius: 12px;
      padding: 10px 18px; color: #fff; font-size: 13px; cursor: pointer; font-weight: 500;
    }
    .custom-row button:hover { background: #4a8aaa; }

    .section-title {
      font-size: 11px; font-weight: 600; color: #bbb;
      margin-bottom: 8px; letter-spacing: 0.05em; text-transform: uppercase;
    }

    .log-list { max-height: 155px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .log-item {
      background: #fff; border-radius: 12px; border: 1px solid #ede8de;
      padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
    }
    .log-amt { font-size: 14px; font-weight: 600; color: #5A9DBF; }
    .log-time { font-size: 11px; color: #ccc; }
    .log-undo { background: none; border: none; cursor: pointer; color: #ccc; font-size: 11px; }
    .log-undo:hover { color: #999; }
    .empty-state { text-align: center; color: #ccc; font-size: 13px; padding: 22px 0; }

    .tab-bar {
      display: flex; justify-content: space-around;
      margin-top: 18px; border-top: 1px solid #e0dbd0; padding-top: 14px;
    }
    .tab-btn {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; font-size: 10px; color: #bbb; padding: 4px 12px; border-radius: 10px;
      transition: color 0.15s;
    }
    .tab-btn.active { color: #5A9DBF; }
    .tab-btn i { font-size: 22px; }

    .chart-wrap {
      background: #fff; border-radius: 14px; border: 1px solid #ede8de;
      padding: 16px; margin-bottom: 10px;
    }
    .chart-inner { position: relative; height: 180px; width: 100%; }

    .stats-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .stat-card {
      flex: 1; background: #fff; border: 1px solid #ede8de;
      border-radius: 12px; padding: 12px; text-align: center;
    }
    .stat-label { font-size: 11px; color: #bbb; margin-bottom: 4px; }
    .stat-val { font-size: 18px; font-weight: 600; color: #5A9DBF; }

    .streak-ring {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; width: 96px; height: 96px;
      border-radius: 50%; border: 4px solid #5A9DBF;
      margin: 0 auto 16px;
    }
    .streak-num { font-size: 30px; font-weight: 700; color: #5A9DBF; }
    .streak-lbl { font-size: 10px; color: #bbb; }

    .goal-card {
      background: #fff; border-radius: 14px; border: 1px solid #ede8de;
      padding: 16px; margin-bottom: 10px;
    }
    .prog-bg { height: 8px; background: #DEEEF7; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
    .prog-fill { height: 100%; background: #5A9DBF; border-radius: 4px; transition: width 0.5s ease; }

    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #2c2c2a; color: #fff; padding: 8px 20px;
      border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity 0.3s; z-index: 99;
    }
    .toast.show { opacity: 1; }

    @media (min-width: 480px) {
      body { padding: 48px 24px; }
    }
  </style>
</head>
<body>

<div class="phone">

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <p class="greeting">Hello there,</p>
    <p class="date-line" id="date-display"></p>

    <div class="bottle-wrap">
      <svg width="130" height="250" viewBox="0 0 130 250" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="pet-clip">
            <path d="M52,32 L52,22 Q52,16 58,16 L72,16 Q78,16 78,22 L78,32 Q88,34 92,42 L96,58 Q100,66 98,74 L102,90 Q108,100 108,112 L108,148 Q112,156 112,168 L112,195 Q112,210 106,218 Q100,226 88,228 L42,228 Q30,226 24,218 Q18,210 18,195 L18,168 Q18,156 22,148 L22,112 Q22,100 28,90 L32,74 Q30,66 34,58 L38,42 Q42,34 52,32 Z"/>
          </clipPath>
        </defs>

        <!-- Cap -->
        <rect x="51" y="6" width="28" height="18" rx="5" fill="#B8C8D4" stroke="#9AAFBE" stroke-width="1"/>
        <line x1="56" y1="8" x2="56" y2="22" stroke="#9AAFBE" stroke-width="1"/>
        <line x1="61" y1="8" x2="61" y2="22" stroke="#9AAFBE" stroke-width="1"/>
        <line x1="65" y1="8" x2="65" y2="22" stroke="#9AAFBE" stroke-width="1"/>
        <line x1="69" y1="8" x2="69" y2="22" stroke="#9AAFBE" stroke-width="1"/>
        <line x1="74" y1="8" x2="74" y2="22" stroke="#9AAFBE" stroke-width="1"/>

        <!-- Neck -->
        <path d="M52,32 L52,22 Q52,16 58,16 L72,16 Q78,16 78,22 L78,32 Q88,34 92,42 L96,58 Q100,66 98,74 L32,74 Q30,66 34,58 L38,42 Q42,34 52,32 Z" fill="#D8EDF7" stroke="#9AAFBE" stroke-width="1.2"/>

        <!-- Body -->
        <path d="M32,74 L28,90 Q22,100 22,112 L22,148 Q18,156 18,168 L18,195 Q18,210 24,218 Q30,226 42,228 L88,228 Q100,226 106,218 Q112,210 112,195 L112,168 Q112,156 108,148 L108,112 Q108,100 102,90 L98,74 Z" fill="#E8F4FB" stroke="none"/>

        <!-- Animated wave water fill -->
        <path id="wave-path" d="" fill="#C1DBED" opacity="0.92" clip-path="url(#pet-clip)"/>
        <path id="wave-path2" d="" fill="#A8CDE0" opacity="0.45" clip-path="url(#pet-clip)"/>

        <!-- Waist indent -->
        <path d="M22,148 Q18,156 18,168 L112,168 Q112,156 108,148 Z" fill="#D0E8F5" opacity="0.35"/>

        <!-- Measurement lines -->
        <line x1="24" y1="200" x2="106" y2="200" stroke="#A8CCE0" stroke-width="0.7" stroke-dasharray="4,3" opacity="0.55"/>
        <line x1="22" y1="180" x2="108" y2="180" stroke="#A8CCE0" stroke-width="0.7" stroke-dasharray="4,3" opacity="0.55"/>
        <line x1="22" y1="130" x2="108" y2="130" stroke="#A8CCE0" stroke-width="0.7" stroke-dasharray="4,3" opacity="0.55"/>
        <line x1="24" y1="100" x2="106" y2="100" stroke="#A8CCE0" stroke-width="0.7" stroke-dasharray="4,3" opacity="0.55"/>
        <text x="114" y="203" font-size="8.5" fill="#7AAFC8" font-family="sans-serif">500</text>
        <text x="114" y="183" font-size="8.5" fill="#7AAFC8" font-family="sans-serif">1000</text>
        <text x="114" y="133" font-size="8.5" fill="#7AAFC8" font-family="sans-serif">1500</text>
        <text x="114" y="103" font-size="8.5" fill="#7AAFC8" font-family="sans-serif">2000</text>

        <!-- Bottle outline (on top) -->
        <path d="M52,32 L52,22 Q52,16 58,16 L72,16 Q78,16 78,22 L78,32 Q88,34 92,42 L96,58 Q100,66 98,74 L102,90 Q108,100 108,112 L108,148 Q112,156 112,168 L112,195 Q112,210 106,218 Q100,226 88,228 L42,228 Q30,226 24,218 Q18,210 18,195 L18,168 Q18,156 22,148 L22,112 Q22,100 28,90 L32,74 Q30,66 34,58 L38,42 Q42,34 52,32 Z" fill="none" stroke="#8AAFC4" stroke-width="1.8" stroke-linejoin="round"/>

        <!-- Glass shine -->
        <ellipse cx="36" cy="105" rx="5" ry="22" fill="#fff" opacity="0.4"/>
        <ellipse cx="38" cy="185" rx="4" ry="14" fill="#fff" opacity="0.3"/>
        <ellipse cx="42" cy="88" rx="6" ry="5" fill="#fff" opacity="0.28"/>

        <!-- Label band -->
        <rect x="22" y="118" rx="3" width="86" height="26" fill="#BDD9EC" opacity="0.2"/>
      </svg>

      <p class="ml-label" id="ml-display">0 ml</p>
      <p class="goal-label" id="goal-display">of 2000 ml daily goal</p>
    </div>

    <div class="quick-add-row">
      <button class="quick-btn" onclick="addWater(150)"><div class="amt">150</div><div>ml · small</div></button>
      <button class="quick-btn" onclick="addWater(250)"><div class="amt">250</div><div>ml · glass</div></button>
      <button class="quick-btn" onclick="addWater(500)"><div class="amt">500</div><div>ml · bottle</div></button>
    </div>

    <div class="custom-row">
      <input type="number" id="custom-ml" placeholder="Custom amount (ml)" min="1" max="5000"/>
      <button onclick="addCustom()">Add</button>
    </div>

    <div class="section-title">Today's log</div>
    <div class="log-list" id="log-list">
      <div class="empty-state">No drinks logged yet.</div>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="screen-history" class="screen">
    <p class="date-line">Weekly history</p>
    <div class="chart-wrap">
      <div class="chart-inner">
        <canvas id="historyChart" role="img" aria-label="Bar chart of daily water intake for the past 7 days"></canvas>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">7-day avg</div>
        <div class="stat-val" id="avg-display">— ml</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Days on goal</div>
        <div class="stat-val" id="goal-days-display">—</div>
      </div>
    </div>
  </div>

  <!-- GOALS -->
  <div id="screen-goals" class="screen">
    <p class="date-line">Goals & streak</p>
    <div class="streak-ring">
      <span class="streak-num" id="streak-display">0</span>
      <span class="streak-lbl">day streak</span>
    </div>
    <div class="goal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-size:13px;color:#555">Daily goal: <strong id="goal-target-display" style="color:#5A9DBF">2000 ml</strong></span>
        <button onclick="editGoal()" style="background:none;border:1px solid #ddd;border-radius:8px;padding:4px 12px;font-size:11px;cursor:pointer;color:#888">Edit</button>
      </div>
      <div style="font-size:12px;color:#bbb;margin-bottom:2px">Today's progress</div>
      <div class="prog-bg"><div class="prog-fill" id="progress-bar" style="width:0%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:2px">
        <span id="progress-consumed" style="color:#5A9DBF">0 ml</span>
        <span id="progress-pct" style="color:#ccc">0%</span>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tab-home" onclick="switchTab('home')">
      <i class="ti ti-droplet" aria-hidden="true"></i>Today
    </button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">
      <i class="ti ti-chart-bar" aria-hidden="true"></i>History
    </button>
    <button class="tab-btn" id="tab-goals" onclick="switchTab('goals')">
      <i class="ti ti-target" aria-hidden="true"></i>Goals
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let GOAL = parseInt(localStorage.getItem('wt_goal') || '2000');
  let logs = JSON.parse(localStorage.getItem('wt_logs') || '[]');
  let weekHistory = JSON.parse(localStorage.getItem('wt_week') || '{}');
  let histChart = null;

  // Wave animation state
  const BOTTLE_TOP = 32, BOTTLE_BOTTOM = 228;
  const BOTTLE_LEFT = 18, BOTTLE_RIGHT = 112;
  const FILL_HEIGHT = BOTTLE_BOTTOM - BOTTLE_TOP;
  let currentFillY = BOTTLE_BOTTOM;
  let targetFillY = BOTTLE_BOTTOM;
  let waveOffset = 0;
  let waveOffset2 = Math.PI;
  let rafId = null;

  function getWavePath(fillY, offset, amplitude) {
    if (fillY >= BOTTLE_BOTTOM) return '';
    const w = BOTTLE_RIGHT - BOTTLE_LEFT;
    const waveW = w + 20;
    const startX = BOTTLE_LEFT - 10;
    const freq = (2 * Math.PI) / waveW;
    const steps = 24;
    let d = `M ${BOTTLE_LEFT - 2} ${BOTTLE_BOTTOM + 2}`;
    d += ` L ${BOTTLE_LEFT - 2} ${fillY}`;
    for (let i = 0; i <= steps; i++) {
      const x = startX + (waveW * i / steps);
      const y = fillY + Math.sin(freq * (waveW * i / steps) + offset) * amplitude;
      d += ` L ${x} ${y}`;
    }
    d += ` L ${BOTTLE_RIGHT + 2} ${BOTTLE_BOTTOM + 2} Z`;
    return d;
  }

  function animateWave() {
    waveOffset = (waveOffset + 0.04) % (2 * Math.PI);
    waveOffset2 = (waveOffset2 + 0.027) % (2 * Math.PI);
    const diff = targetFillY - currentFillY;
    currentFillY += diff * 0.06;
    const pct = Math.max(0, Math.min(1, (BOTTLE_BOTTOM - currentFillY) / FILL_HEIGHT));
    const amplitude = currentFillY >= BOTTLE_BOTTOM - 2 ? 0 : Math.max(1.5, 4 * (1 - pct * 0.5));
    const wp = document.getElementById('wave-path');
    const wp2 = document.getElementById('wave-path2');
    if (wp) wp.setAttribute('d', getWavePath(currentFillY, waveOffset, amplitude));
    if (wp2) wp2.setAttribute('d', getWavePath(currentFillY + amplitude * 0.6, waveOffset2, amplitude * 0.7));
    rafId = requestAnimationFrame(animateWave);
  }

  function setFillLevel(total) {
    const pct = Math.min(total / GOAL, 1);
    targetFillY = BOTTLE_BOTTOM - Math.round(pct * FILL_HEIGHT);
  }

  function today() { return new Date().toISOString().slice(0, 10); }

  function saveLogs() {
    localStorage.setItem('wt_logs', JSON.stringify(logs));
    const total = logs.filter(l => l.date === today()).reduce((s, l) => s + l.ml, 0);
    weekHistory[today()] = total;
    localStorage.setItem('wt_week', JSON.stringify(weekHistory));
  }

  function todayTotal() {
    return logs.filter(l => l.date === today()).reduce((s, l) => s + l.ml, 0);
  }

  function addWater(ml) {
    logs.unshift({ date: today(), time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), ml });
    saveLogs(); render(); showToast('+' + ml + ' ml added');
  }

  function addCustom() {
    const v = parseInt(document.getElementById('custom-ml').value);
    if (!v || v <= 0) return;
    addWater(v); document.getElementById('custom-ml').value = '';
  }

  function removeLog(idx) { logs.splice(idx, 1); saveLogs(); render(); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function renderHome() {
    const total = todayTotal();
    document.getElementById('ml-display').textContent = total + ' ml';
    document.getElementById('goal-display').textContent = 'of ' + GOAL + ' ml daily goal';
    setFillLevel(total);
    const todayLogs = logs.filter(l => l.date === today());
    const list = document.getElementById('log-list');
    if (!todayLogs.length) {
      list.innerHTML = '<div class="empty-state">No drinks logged yet.</div>';
    } else {
      list.innerHTML = '';
      todayLogs.forEach((l, i) => {
        const d = document.createElement('div');
        d.className = 'log-item';
        d.innerHTML = '<span class="log-amt">+' + l.ml + ' ml</span><span style="display:flex;align-items:center;gap:8px"><span class="log-time">' + l.time + '</span><button class="log-undo" onclick="removeLog(' + i + ')">undo</button></span>';
        list.appendChild(d);
      });
    }
  }

  function renderHistory() {
    const labels = [], vals = [], base = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(base); d.setDate(base.getDate() - i);
      const key = d.toISOString().slice(0, 10);
      labels.push(d.toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 3));
      vals.push(i === 0 ? todayTotal() : (weekHistory[key] || 0));
    }
    const nz = vals.filter(v => v > 0);
    document.getElementById('avg-display').textContent = (nz.length ? Math.round(nz.reduce((a, b) => a + b, 0) / nz.length) : 0) + ' ml';
    document.getElementById('goal-days-display').textContent = vals.filter(v => v >= GOAL).length + ' / 7';
    if (histChart) { histChart.destroy(); histChart = null; }
    histChart = new Chart(document.getElementById('historyChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'ml', data: vals,
          backgroundColor: vals.map(v => v >= GOAL ? '#5A9DBF' : '#C1DBED'),
          borderRadius: 6, borderSkipped: false
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, max: Math.max(GOAL, ...vals) + 200, ticks: { font: { size: 10 }, color: '#aaa', callback: v => v + 'ml' }, grid: { color: 'rgba(0,0,0,0.05)' } },
          x: { ticks: { font: { size: 11 }, color: '#888' }, grid: { display: false } }
        }
      }
    });
  }

  function renderGoals() {
    const total = todayTotal(), pct = Math.min(Math.round(total / GOAL * 100), 100);
    document.getElementById('streak-display').textContent = calcStreak();
    document.getElementById('goal-target-display').textContent = GOAL + ' ml';
    document.getElementById('progress-consumed').textContent = total + ' ml';
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-pct').textContent = pct + '%';
  }

  function calcStreak() {
    let s = 0; const base = new Date();
    for (let i = 0; i <= 60; i++) {
      const d = new Date(base); d.setDate(base.getDate() - i);
      const key = d.toISOString().slice(0, 10);
      const v = i === 0 ? todayTotal() : (weekHistory[key] || 0);
      if (v >= GOAL) s++; else if (i > 0) break;
    }
    return s;
  }

  function editGoal() {
    const v = parseInt(prompt('Set your daily goal (ml):', GOAL));
    if (v && v > 0) { GOAL = v; localStorage.setItem('wt_goal', GOAL); render(); }
  }

  function render() {
    document.getElementById('date-display').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    renderHome(); renderGoals();
  }

  function switchTab(tab) {
    ['home', 'history', 'goals'].forEach(t => {
      document.getElementById('screen-' + t).classList.toggle('active', t === tab);
      document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    });
    if (tab === 'history') renderHistory();
  }

  render();
  rafId = requestAnimationFrame(animateWave);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(() => console.log('Service Worker registered'))
      .catch(err => console.log('Service Worker registration failed:', err));
  });
}
</script>

</body>
</html>
